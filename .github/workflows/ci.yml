name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit + simulation tests
        run: npm test
      - name: Headless balance run (24 CPU games)
        run: npm run sim -- 24 pro
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: blitzball-x-dist
          path: dist
